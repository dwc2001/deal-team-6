# Supabase pauses free projects after a week with no activity. A small request
# every few days keeps the team's database awake over holidays.
name: Keep database awake

on:
  schedule:
    - cron: "17 14 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    if: ${{ vars.VITE_SUPABASE_URL != '' }}
    steps:
      - run: >
          curl -fsS "${{ vars.VITE_SUPABASE_URL }}/rest/v1/categories?select=name&limit=1"
          -H "apikey: ${{ vars.VITE_SUPABASE_ANON_KEY }}" -o /dev/null && echo "awake"
