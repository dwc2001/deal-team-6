# Supabase pauses free projects after a week with no activity. A single read every
# three days was not enough (it paused on 2026-10-28), so this runs daily and
# touches both the database and the login service.
name: Keep database awake

on:
  schedule:
    - cron: "17 14 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    if: ${{ vars.VITE_SUPABASE_URL != '' }}
    steps:
      - run: |
          curl -fsS "${{ vars.VITE_SUPABASE_URL }}/rest/v1/categories?select=name&limit=5" -H "apikey: ${{ vars.VITE_SUPABASE_ANON_KEY }}" -o /dev/null
          curl -fsS "${{ vars.VITE_SUPABASE_URL }}/rest/v1/links?select=id&limit=5" -H "apikey: ${{ vars.VITE_SUPABASE_ANON_KEY }}" -o /dev/null
          curl -fsS "${{ vars.VITE_SUPABASE_URL }}/auth/v1/settings" -H "apikey: ${{ vars.VITE_SUPABASE_ANON_KEY }}" -o /dev/null
          echo "awake"
